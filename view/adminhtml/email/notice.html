<!--@subject {{var subject}} @-->
<!--@vars {"var subject":"Subject","var heading":"Heading","var intro":"Intro","var rows|raw":"Rows","var footer":"Footer"} @-->
<div style="background:#f4f5f8;padding:24px 12px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1b1e27">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:10px;padding:28px 28px 20px">
    <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#4f6ef7;font-weight:600">MageSentinel</div>
    <h1 style="font-size:20px;line-height:1.3;margin:8px 0 10px">{{var heading|raw}}</h1>
    <p style="margin:0 0 14px;color:#4a4f5c;line-height:1.5">{{var intro|raw}}</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;line-height:1.45">{{var rows|raw}}</table>
    <p style="margin:18px 0 0;font-size:12px;color:#8a8f98;line-height:1.5">{{var footer|raw}}</p>
  </div>
</div>
